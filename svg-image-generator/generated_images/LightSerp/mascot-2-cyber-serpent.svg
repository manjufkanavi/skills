<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF"/>
      <stop offset="100%" style="stop-color:#E040FB"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#76FF03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#F3E5F5"/>
  
  <!-- Circuit board pattern in background -->
  <g opacity="0.08" stroke="#7C4DFF" stroke-width="2" fill="none">
    <line x1="80" y1="100" x2="150" y2="100"/>
    <line x1="150" y1="100" x2="150" y2="170"/>
    <circle cx="150" cy="170" r="5" fill="#7C4DFF"/>
    <line x1="360" y1="80" x2="360" y2="150"/>
    <line x1="360" y1="150" x2="420" y2="150"/>
    <circle cx="420" cy="150" r="5" fill="#7C4DFF"/>
    <line x1="100" y1="400" x2="180" y2="400"/>
    <line x1="180" y1="400" x2="180" y2="340"/>
    <circle cx="180" cy="340" r="5" fill="#7C4DFF"/>
    <line x1="380" y1="380" x2="320" y2="380"/>
    <line x1="320" y1="380" x2="320" y2="300"/>
    <circle cx="320" cy="300" r="5" fill="#7C4DFF"/>
  </g>
  
  <!-- Serpent body - sleek and robotic -->
  <path d="M256 400 C200 400 170 360 170 300 C170 240 200 220 220 220 C240 220 250 240 250 260 C250 280 240 290 230 290" 
        fill="none" stroke="url(#bodyGrad2)" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Robotic armor plates -->
  <path d="M210 280 L230 270 L235 290 L215 300 Z" fill="#B388FF" opacity="0.6"/>
  <path d="M225 240 L245 230 L248 250 L228 260 Z" fill="#B388FF" opacity="0.5"/>
  
  <!-- Serpent head - angular and cool -->
  <path d="M260 160 L300 145 L310 175 L295 200 L265 200 L250 175 Z" fill="url(#bodyGrad2)" filter="url(#shadow2)"/>
  
  <!-- Visor / cyber eye -->
  <rect x="258" y="155" width="50" height="18" rx="9" fill="url(#visorGrad)" filter="url(#glow)"/>
  
  <!-- Antenna -->
  <line x1="285" y1="145" x2="285" y2="115" stroke="#B388FF" stroke-width="3"/>
  <circle cx="285" cy="112" r="6" fill="#00E5FF" filter="url(#glow)"/>
  
  <!-- Data streams from eyes -->
  <g opacity="0.6">
    <line x1="265" y1="164" x2="200" y2="164" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="295" y1="164" x2="360" y2="164" stroke="#76FF03" stroke-width="2" stroke-dasharray="4,3"/>
  </g>
  
  <!-- Tech collar -->
  <path d="M255 200 Q280 215 305 200" fill="none" stroke="#B388FF" stroke-width="4"/>
  <circle cx="280" cy="210" r="4" fill="#00E5FF" filter="url(#glow)"/>
  
  <!-- Floating data nodes -->
  <g>
    <rect x="100" y="180" width="20" height="14" rx="3" fill="#7C4DFF" opacity="0.5"/>
    <rect x="130" y="140" width="16" height="16" rx="3" fill="#E040FB" opacity="0.4"/>
    <rect x="380" y="200" width="24" height="12" rx="3" fill="#00E5FF" opacity="0.5"/>
    <rect x="350" y="260" width="18" height="18" rx="3" fill="#76FF03" opacity="0.4"/>
    <rect x="120" y="300" width="22" height="10" rx="3" fill="#B388FF" opacity="0.5"/>
    <rect x="390" y="320" width="14" height="14" rx="3" fill="#E040FB" opacity="0.4"/>
  </g>
  
  <!-- Web crawl arrows -->
  <path d="M110 250 L140 250 L140 235" fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.4"/>
  <path d="M400 280 L370 280 L370 295" fill="none" stroke="#E040FB" stroke-width="2" opacity="0.4"/>
</svg>
