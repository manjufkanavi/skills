<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logo2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF"/>
      <stop offset="100%" style="stop-color:#00E5FF"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Clean white background -->
  <rect width="512" height="512" fill="white"/>
  
  <!-- Abstract 'L' shape made of circuit traces -->
  <g stroke="url(#logo2Grad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow2)">
    <!-- Vertical line -->
    <line x1="160" y1="80" x2="160" y2="400"/>
    <!-- Horizontal line -->
    <line x1="160" y1="400" x2="380" y2="400"/>
    <!-- Circuit branches -->
    <line x1="160" y1="160" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="220" y2="100"/>
    <line x1="240" y1="400" x2="240" y2="340"/>
    <line x1="240" y1="340" x2="300" y2="340"/>
    <line x1="300" y1="340" x2="300" y2="280"/>
    <line x1="320" y1="400" x2="320" y2="360"/>
    <line x1="320" y1="360" x2="360" y2="360"/>
  </g>
  
  <!-- Circuit node dots -->
  <circle cx="220" cy="100" r="8" fill="#7C4DFF" filter="url(#glow2)"/>
  <circle cx="220" cy="160" r="8" fill="#00E5FF" filter="url(#glow2)"/>
  <circle cx="240" cy="340" r="8" fill="#7C4DFF" filter="url(#glow2)"/>
  <circle cx="300" cy="280" r="8" fill="#00E5FF" filter="url(#glow2)"/>
  <circle cx="320" cy="360" r="8" fill="#7C4DFF" filter="url(#glow2)"/>
  <circle cx="360" cy="360" r="8" fill="#00E5FF" filter="url(#glow2)"/>
  
  <!-- Serpent eye integrated at the corner -->
  <ellipse cx="160" cy="400" rx="18" ry="12" fill="url(#logo2Grad)"/>
  <ellipse cx="160" cy="400" rx="8" ry="5" fill="white"/>
  <circle cx="160" cy="400" r="3" fill="#1A1A2E"/>
  
  <!-- Data flow arrows -->
  <path d="M380 400 L395 390 L395 410 Z" fill="#00E5FF" opacity="0.6"/>
  <path d="M160 80 L150 95 L170 95 Z" fill="#7C4DFF" opacity="0.6"/>
</svg>
