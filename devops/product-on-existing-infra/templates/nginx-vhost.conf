# Nginx vHost Template
# Usage: Copy to /home/mkanavi/docker/iacgenie/nginx/conf.d/<product>.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name <subdomain>.iacgenie.com;

    # Passthrough for Cloudflare tunnel (avoid redirect loop)
    location / {
        proxy_pass http://127.0.0.1:<HOST_PORT>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name <subdomain>.iacgenie.com;

    # SSL certificates (managed by Cloudflare/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/iacgenie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iacgenie.com/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=<product>_api:10m rate=10r/s;

    location / {
        limit_req zone=<product>_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:<HOST_PORT>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (public, no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:<HOST_PORT>;
        proxy_set_header Host $host;
    }
}
